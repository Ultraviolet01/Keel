[package]
name = "keel-vault"
version = "0.1.0"
edition = "2021"
description = "Keel Vault: holds a company's USDC and enforces the limits Keel's agent must stay inside"
license = "MIT"
repository = "https://github.com/Ultraviolet01/Keel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
